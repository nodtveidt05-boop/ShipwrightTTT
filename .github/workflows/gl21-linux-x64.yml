name: Build Shipwright (GL 2.1 patch, Linux x86_64)

on:
  workflow_dispatch:
  push:
    branches: [ "gl21-patch" ]

jobs:
  generate-soh-otr:
    runs-on: ubuntu-22.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat linux-build-deps/apt.txt)

      - name: Apply GL 2.1 patch
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib

          def patch(path, subs):
              p = pathlib.Path(path)
              s = p.read_bytes().decode("utf-8")
              for pat, rep, expected in subs:
                  s, n = re.subn(pat, rep, s)
                  if n != expected:
                      sys.exit(f"PATCH FALHOU em {path}: {pat!r} -> {n} ocorrencias (esperado {expected})")
                  print(f"ok {p.name}: {pat!r} x{n}")
              p.write_bytes(s.encode("utf-8"))

          patch("libultraship/src/fast/backends/gfx_opengl.cpp", [
              (r'\{ "GLSL_VERSION", "#version 130" \}', '{ "GLSL_VERSION", "#version 120" }', 1),
          ])
          patch("libultraship/src/fast/shaders/opengl/default.shader.glsl", [
              (r'textureSize\(uTexMask@\{i\}, 0\)', 'texSize@{i}', 2),
              (r'mix\(higher, lower, cutoff\)', 'mix(higher, lower, vec3(cutoff))', 1),
          ])
          EOF

      - name: Generate soh.o2r
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DSOH_TOOLS_ONLY=ON
          cmake --build build-cmake --config Release --target GenerateSohOtr -j4

      - name: Upload soh.o2r
        uses: actions/upload-artifact@v4
        with:
          name: soh.o2r
          path: soh.o2r
          retention-days: 3

  build-linux:
    needs: generate-soh-otr
    runs-on: ubuntu-22.04
    steps:
      - name: Git Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y $(cat linux-build-deps/apt.txt)

      - name: Create deps folder
        run: mkdir -p deps

      - name: Install latest SDL
        run: |
          wget https://github.com/libsdl-org/SDL/releases/download/release-2.30.3/SDL2-2.30.3.tar.gz
          tar -xzf SDL2-2.30.3.tar.gz -C deps
          cd deps/SDL2-2.30.3
          ./configure --enable-hidapi-libusb
          make -j$(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - uses: ./.github/actions/install-sdl2-net

      - name: Copy SDL libs to multiarch dir
        run: sudo cp -av /usr/local/lib/libSDL* /lib/x86_64-linux-gnu/

      - name: Remove distro tinyxml2
        run: sudo apt-get remove -y libtinyxml2-dev

      - uses: ./.github/actions/install-tinyxml2

      - name: Install libzip without crypto
        run: |
          sudo apt-get remove -y libzip-dev
          wget https://github.com/nih-at/libzip/releases/download/v1.10.1/libzip-1.10.1.tar.gz
          tar -xzf libzip-1.10.1.tar.gz -C deps
          cd deps/libzip-1.10.1
          mkdir -p build
          cd build
          cmake .. -DENABLE_COMMONCRYPTO=OFF -DENABLE_GNUTLS=OFF -DENABLE_MBEDTLS=OFF -DENABLE_OPENSSL=OFF
          make -j$(nproc)
          sudo make install
          sudo cp -av /usr/local/lib/libzip* /lib/x86_64-linux-gnu/

      - name: Apply GL 2.1 patch
        run: |
          python3 - <<'EOF'
          import re, sys, pathlib

          def patch(path, subs):
              p = pathlib.Path(path)
              s = p.read_bytes().decode("utf-8")
              for pat, rep, expected in subs:
                  s, n = re.subn(pat, rep, s)
                  if n != expected:
                      sys.exit(f"PATCH FALHOU em {path}: {pat!r} -> {n} ocorrencias (esperado {expected})")
                  print(f"ok {p.name}: {pat!r} x{n}")
              p.write_bytes(s.encode("utf-8"))

          patch("libultraship/src/fast/backends/gfx_opengl.cpp", [
              (r'\{ "GLSL_VERSION", "#version 130" \}', '{ "GLSL_VERSION", "#version 120" }', 1),
          ])
          patch("libultraship/src/fast/shaders/opengl/default.shader.glsl", [
              (r'textureSize\(uTexMask@\{i\}, 0\)', 'texSize@{i}', 2),
              (r'mix\(higher, lower, cutoff\)', 'mix(higher, lower, vec3(cutoff))', 1),
          ])
          EOF

      - name: Download soh.o2r
        uses: actions/download-artifact@v4
        with:
          name: soh.o2r
          path: build-cmake/soh

      - name: Build SoH
        run: |
          cmake --no-warn-unused-cli -H. -Bbuild-cmake -GNinja -DCMAKE_BUILD_TYPE:STRING=Release -DBUILD_REMOTE_CONTROL=1
          cmake --build build-cmake --config Release -j4
          (cd build-cmake && cpack -G External)
          mv build-cmake/*.appimage soh.appimage
        env:
          CC: gcc-12
          CXX: g++-12

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: shipwright-gl21-linux-x64
          path: |
            soh.appimage
            build-cmake/soh/soh.elf
